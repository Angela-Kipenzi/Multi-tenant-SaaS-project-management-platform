name: backend

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saas_pm
          POSTGRES_USER: saas_pm
          POSTGRES_PASSWORD: saas_pm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saas_pm" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret
      POSTGRES_DB: saas_pm
      POSTGRES_USER: saas_pm
      POSTGRES_PASSWORD: saas_pm
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # mypy and check --deploy are disabled — see README "Type safety" section
      - run: pytest -n auto
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/htmlcov